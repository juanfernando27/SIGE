# Sustituir __API_HOST__ por el hostname de HTTP API Gateway (sin https:// ni ruta).
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-SIGE-Instance $hostname always;
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"sige-web"}';
  }
  location /api/ {
    resolver 169.254.169.253 valid=60s ipv6=off;
    set $api_host __API_HOST__;
    proxy_pass https://$api_host$request_uri;
    proxy_ssl_server_name on;
    proxy_ssl_name $api_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_set_header Host $api_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 29s;
    proxy_cache off;
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
